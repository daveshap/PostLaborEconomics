, 'Book Antiqua', 'TeX Gyre Pagella', serif;font-weight:400;font-style:italic;font-size:12.5px;letter-spacing:0px;fill:#000}.ref{font-family:'Montserrat', sans-serif;font-weight:600;font-style:normal;font-size:8px;letter-spacing:1.6px;fill:#000}.refs{font-family:'Palatino Linotype', Palatino, 'Book Antiqua', 'TeX Gyre Pagella', serif;font-weight:400;font-style:italic;font-size:10.5px;letter-spacing:0px;fill:#000}</style>
