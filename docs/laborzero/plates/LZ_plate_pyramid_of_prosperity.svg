<text x="162.45" y="299.70" class="tn" text-anchor="middle" data-tier="3">COLLECTIVELY OWNED</text>
<text x="162.45" y="309.70" class="tn" text-anchor="middle" data-tier="3">PRIVATE ASSETS</text>
<text x="162.00" y="322.90" class="td" text-anchor="middle" data-tier="3">Co-ops, employee-owned firms, community</text>
<text x="162.00" y="332.80" class="td" text-anchor="middle" data-tier="3">land trusts and platform cooperatives</text>
<circle cx="263.50" cy="314.00" r="7.2" fill="#fff" stroke="#000" stroke-width="0.6"/>
<text x="263.50" y="317.40" class="num" text-anchor="middle">3</text>
