<text x="0" y="0" class="axt" text-anchor="middle" transform="translate(60.14 307.33) rotate(-73.03)">PEOPLE TOUCHED, BY DEFAULT</text>
<text x="12.00" y="465.00" class="ax" text-anchor="start">EVERYONE</text>
<text x="104.80" y="169.00" class="ax" text-anchor="middle">FEWEST</text>
