<text x="162.45" y="354.90" class="tn" text-anchor="middle" data-tier="2">COLLECTIVELY OWNED</text>
<text x="162.45" y="364.90" class="tn" text-anchor="middle" data-tier="2">PUBLIC WEALTH</text>
<text x="162.00" y="378.10" class="td" text-anchor="middle" data-tier="2">Funds that own productive assets in common</text>
<text x="162.00" y="388.00" class="td" text-anchor="middle" data-tier="2">and pay returns to the whole population</text>
<circle cx="280.34" cy="369.20" r="7.2" fill="#fff" stroke="#000" stroke-width="0.6"/>
<text x="280.34" y="372.60" class="num" text-anchor="middle">2</text>
