<text x="162.45" y="415.10" class="tn" text-anchor="middle" data-tier="1">THE UNIVERSALS</text>
<text x="162.00" y="428.30" class="td" text-anchor="middle" data-tier="1">Cash, services and capital endowments</text>
<text x="162.00" y="438.20" class="td" text-anchor="middle" data-tier="1">that reach everyone by default</text>
<circle cx="297.19" cy="424.40" r="7.2" fill="#fff" stroke="#000" stroke-width="0.6"/>
