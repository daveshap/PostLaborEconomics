<text x="162.45" y="244.50" class="tn" text-anchor="middle" data-tier="4">PRIVATE WEALTH</text>
<text x="162.45" y="254.50" class="tn" text-anchor="middle" data-tier="4">ACCUMULATION</text>
<text x="162.00" y="267.70" class="td" text-anchor="middle" data-tier="4">Help for every household to build</text>
<text x="162.00" y="277.60" class="td" text-anchor="middle" data-tier="4">wealth that earns apart from wages</text>
<circle cx="246.66" cy="258.80" r="7.2" fill="#fff" stroke="#000" stroke-width="0.6"/>
<text x="246.66" y="262.20" class="num" text-anchor="middle">4</text>
