<text x="162.45" y="189.30" class="tn" text-anchor="middle" data-tier="5">RESIDUAL</text>
<text x="162.45" y="199.30" class="tn" text-anchor="middle" data-tier="5">WAGES</text>
<text x="162.00" y="212.50" class="td" text-anchor="middle" data-tier="5">Work that remains, no longer</text>
<text x="162.00" y="222.40" class="td" text-anchor="middle" data-tier="5">the only gateway to security</text>
<circle cx="229.81" cy="203.60" r="7.2" fill="#fff" stroke="#000" stroke-width="0.6"/>
<text x="229.81" y="207.00" class="num" text-anchor="middle">5</text>
